/* ===========================================================================
   ARC STANDARD — do-not-merge mockup. Branch mockup/arc-standard.
   Binding record: docs/studio/arc-standard-brief.md (commit 9f254a0).
   Stage 1R amendments: mockups/arc-standard-notes.md (PALETTE-X, SHAPES-X).

   TOKEN SNAPSHOTS — every hex below is copied from the live tree at the
   commit above. Each maps to its source var so the build can re-point to
   the real token rather than this literal:

     --tw-1        #191F33  <-  --hour-1        theme.css:94   zenith, night blue
     --tw-2        #1B1D2B  <-  --hour-2        theme.css:95   the turn
     --tw-3        #241C14  <-  --hour-3        theme.css:96   warming
     --tw-4        #29200F  <-  --hour-4        theme.css:97   horizon, ember brown
     (world gradient mirrors --hour-arc / --hour-lamp / --hour-horizon  theme.css:98-100)

     --sheet-1     #FDF9EE  <-  --card-1        theme.css:114  vellum, lit-page top
     --sheet-2     #F6EFDC  <-  --card-2        theme.css:115  vellum, lit-page foot
     --sheet-ink   #262019  <-  --card-ink      theme.css:116
     --sheet-ink-2 #5C5340  <-  --card-ink-2    theme.css:117
     --sheet-meta  #8A7F5F  <-  --card-meta     theme.css:118
     --sheet-radius 15px    <-  --card-radius   theme.css:119
     (sheet shadow mirrors --card-shadow        theme.css:121)
     --world-gap   18px     <-  --sheet-gap     theme.css:156  world margin

     --gold-on-card #8F6A12 <- --gold-on-card  theme.css:111  attention on the sheet
     --gold-ember   #DFB759 <- --gold-ember    theme.css:110  value embers on the sky
     --thread       #c2a463 <- --thread        theme.css:53   connection chrome (gold
                                               family; law 10 — never cyan)

     --dur-fast   150ms                  <- --dur-fast      praxis-kit.css:36
     --dur-gentle 300ms                  <- --dur-gentle    praxis-kit.css:36  (MO-1)
     --ease-standard cubic-bezier(.22,1,.36,1) <- praxis-kit.css:37
     type ramp: display clamp(30,4.2vw,46) / title 26 / heading 18 / body 15 /
                meta 12 (absolute floor) / reader 17   <- praxis-kit.css:29-34

   ---------------------------------------------------------------------------
   PALETTE-X (Preston felt ruling, Stage 1 review, 2026-07-22) — the mark
   pigment family expands 5 -> 10. This AMENDS the committed brief's F6 hue
   budget ("the five shipped jewel families m1-m5, re-frozen"). Discipline is
   retained: 10 perceptually-spaced earth/jewel pigments, every one measured;
   candy is still dead, because hue is still SECOND to form (SHAPES-X) and
   GLOW IS GOLD-ONLY — a pigment never glows (semantic gold law).

   AA — measured, worst case. Both vellum ends were measured; the sheet FOOT
   (#F6EFDC) is the worst case for dark marks and is the number that rules.
   (Stage 1 measured only the lighter top: moss would have passed there at
   3.22 and FAILED here at 2.96. It was re-tuned to #55913F before shipping.)
   Floor = 3:1, the WCAG graphical-object minimum.

     pigment       fill      hue   vs top  vs foot   edge      vs foot
     madder       #B8425A    348    5.03    4.62    #85293D     7.68
     terracotta   #C75434     13    4.21    3.86    #94371F     6.48
     ochre        #A65F10     32    4.68    4.29    #74400A     7.38
     olive        #7C8B4F     75    3.52    3.23    #556032     5.89
     moss         #55913F    104    3.62    3.32    #3B682B     5.72
     verdigris    #3C9257    139    3.67    3.36    #1F6334     6.33
     teal         #3E8A83    174    3.86    3.54    #266059     6.31
     lapis        #4A7BB8    213    4.14    3.80    #2F5484     6.72
     iris         #7A6BB8    252    4.32    3.96    #55447E     7.28
     plum         #A85A8E    320    4.42    4.05    #7A3D64     6.83
     20/20 PASS. Band 3.23-4.62 — deliberately narrow, so no pigment reads
     heavier than another at field distance.

   R-2 — GOLD RETIRED AS A PIGMENT (Preston, 2026-07-22). Semantic gold
   completes: gold is attention / coal / harvest ONLY, never identity. The
   pigment slot it vacated is held by VERDIGRIS #3C9257 (hue 139) — dead
   centre of the widest remaining gap (moss 104 -> teal 174), 35 degrees from
   each neighbour against a 25-degree floor, 3.36:1 on the foot, aged-copper
   register with no gold in it. Hue spacing after the swap, in order:
     348 · 13 · 32 · 75 · 104 · 139 · 174 · 213 · 252 · 320
     gaps 25 · 19 · 43 · 29 · 35 · 35 · 39 · 39 · 68 · 28
   The tightest pair is now terracotta/ochre at 19 degrees, separated by
   lightness (3.86 vs 4.29) — the old gold/ochre 11-degree squeeze is gone,
   so R-2 made the palette MORE separable, not less.
   MIGRATION: existing m1/gold marks re-point to OCHRE (nearest surviving
   pigment) — deterministic, per G3's re-point law; nothing else changes, and
   recomposition is offered in the composer, never applied.

   Anchor provenance (which shipped jewels survived):
     gold       = --m1-on-ground #9D7A20  theme.css:205 — the standing Fork-B
                  ruling, now MOOT as a pigment: R-2 retires gold from the
                  identity set entirely. The value survives in this file only
                  as --gold, the attention ink. Raw --m1 #D9B24A measures
                  1.76:1 on the foot and could never have touched this sheet.
     terracotta = --m2 #C75434  theme.css:209   RAW, unchanged
     olive      = --m3 #7C8B4F  theme.css:210   RAW, unchanged
     teal       = --m4 #3E8A83  theme.css:211   RAW, unchanged
     ochre      = --m5 #B07514 SHIFTED to #A65F10 (hue 37 -> 32). NOT an AA
                  change (raw ochre passes at 3.39) — a SPACING change: at
                  5-wide, ochre 37 and gold 43 could coexist; at 10-wide, 6
                  degrees apart is a collision. The brief's own words license
                  this ("keep m1-m5's hue anchors WHERE THEY SURVIVE SPACING").
                  Flagged for the felt pass: gold/ochre remain the tightest
                  pair at 11 degrees, separated by lightness (3.49 vs 4.29).
     madder moss lapis iris plum = new at PALETTE-X; verdigris = new at R-2.
                  Preston's candidate list also named RUST; it is deliberately
                  absent — rust lands at hue ~15-20, on top of terracotta.
                  IRIS (252) was substituted to hold the blue-violet gap.
                  Substitution is explicitly permitted ("you may substitute
                  better forms").

   SHAPES-X (same ruling) — silhouettes expand 5 -> 10, verified in the probe
   at the SMALLEST maturity size F-4 produces (34px), not at resting size:
   see mockups/shots/stage-1r/stage-1r-probe-min-1360.png (P-1). Uniqueness
   law unchanged: no two marks in one arc share a full silhouette|treatment|
   pigment triple.
   ---------------------------------------------------------------------------

   FIXTURE PROVENANCE (real-data substrate law) — CORRECTED at Stage 1R:
     growing  = REAL. Read from js/state.js:3648-3677 (the '__praxis_seed__'
                "A Pedagogy of Desire" worked example that self-seeds on a
                fresh origin — repo-shipped seed data, not private account
                content). REAL sub-theory titles, REAL evidence counts, REAL
                body lengths, REAL member books, REAL connection graph.
                *** Stage 1 claimed "5 sub-theories" and invented five titles
                and five book titles. The arc really has FOUR sub-theories and
                the five books are Giroux/hooks/Grant/Epstein/Hurston. The
                fifth mark ("A note on grading", 102 chars) was synthetic and
                is retired. The four body lengths Stage 1 carried
                (1658/1455/3156/1568) were real and are preserved. ***
     ember    = SYNTHETIC-SHAPE (extrapolated; no zero-sub-theory arc exists)
     finished = SYNTHETIC-SHAPE (extrapolated; no finished arc exists; its 2
                value embers and its 6-mark graph are invented — the graph
                deliberately, to satisfy F-1's "not every mark connected",
                which the REAL graph cannot show. See notes.md, F-1/P-2.)
   Sub-theory titles and book titles are repo-shipped seed literals. No
   marginalia, journal, or question prose from any account appears here; the
   question and the finished answer are synthetic.
   =========================================================================== */

:root{
  /* twilight world */
  --tw-1:#191F33; --tw-2:#1B1D2B; --tw-3:#241C14; --tw-4:#29200F;
  --world-arc:linear-gradient(178deg,var(--tw-1) 0%,var(--tw-2) 36%,var(--tw-3) 70%,var(--tw-4) 100%);
  --world-lamp:radial-gradient(1200px 640px at 50% -12%,rgba(255,214,150,.08),transparent 60%);
  --world-horizon:radial-gradient(1000px 460px at 50% 112%,rgba(255,175,100,.06),transparent 62%);
  /* the lit sheet */
  --sheet-1:#FDF9EE; --sheet-2:#F6EFDC;
  --sheet-ink:#262019; --sheet-ink-2:#5C5340; --sheet-meta:#8A7F5F;
  --sheet-radius:15px; --world-gap:18px;
  --sheet-shadow:0 0 0 1px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.28),0 10px 30px rgba(0,0,0,.26);
  --rule:rgba(38,32,25,.12);
  /* PALETTE-X — 10 pigments, all AA-measured on the sheet foot (table above) */
  --madder:#B8425A;     --madder-edge:#85293D;
  --terracotta:#C75434; --terracotta-edge:#94371F;
  --ochre:#A65F10;      --ochre-edge:#74400A;
  --olive:#7C8B4F;      --olive-edge:#556032;
  --moss:#55913F;       --moss-edge:#3B682B;
  --verdigris:#3C9257;  --verdigris-edge:#1F6334;
  --teal:#3E8A83;       --teal-edge:#266059;
  --lapis:#4A7BB8;      --lapis-edge:#2F5484;
  --iris:#7A6BB8;       --iris-edge:#55447E;
  --plum:#A85A8E;       --plum-edge:#7A3D64;
  /* attention + connection — GOLD ONLY. Pigment never glows. */
  --gold:#8F6A12; --gold-ember:#DFB759; --thread:#c2a463;
  /* motion (MO-1) */
  --dur-fast:150ms; --dur-gentle:300ms; --ease:cubic-bezier(.22,1,.36,1);
  /* type */
  --ff-display:'Cormorant Garamond',Georgia,serif;
  --ff-body:'DM Sans',-apple-system,system-ui,sans-serif;
  --ff-mono:'DM Mono','SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background-color:var(--tw-1);
  background-image:var(--world-lamp),var(--world-horizon),var(--world-arc);
  background-attachment:fixed;
  min-height:100vh;
  font-family:var(--ff-body);
  color:#cfc4a8;
  -webkit-font-smoothing:antialiased;
}

/* ---- mockup chrome: the ONLY dev affordances in this file (weather + width) --- */
.mk-bar{
  position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:8px 16px; background:rgba(12,14,22,.86);
  border-bottom:1px solid rgba(255,236,200,.12);
  font-family:var(--ff-mono); font-size:11px; letter-spacing:.06em; color:#9d947c;
}
.mk-bar b{color:#e8dcc4; font-weight:500; letter-spacing:.14em; text-transform:uppercase; font-size:10px}
.mk-seg{display:inline-flex; border:1px solid rgba(255,236,200,.22); border-radius:999px; padding:2px; background:rgba(0,0,0,.3)}
.mk-seg button{
  font-family:var(--ff-mono); font-size:11px; color:#9d947c; background:none; border:0;
  border-radius:999px; padding:5px 12px; cursor:pointer;
}
.mk-seg button.on{background:linear-gradient(180deg,#F0D79A,#DFB759); color:#241a02; font-weight:500}
.mk-note{font-size:10.5px; color:#7d7563}
.mk-note .synth{color:#DFB759}

/* ---- the world: the sheet floats on the twilight with visible margins ------- */
.world{
  padding:calc(46px + var(--world-gap) * 2) var(--world-gap) calc(var(--world-gap) * 3);
  display:flex; justify-content:center;
}
.sheet{
  width:100%; max-width:1200px;
  background-color:var(--sheet-1);
  background-image:linear-gradient(180deg,var(--sheet-1) 0%,var(--sheet-2) 100%);
  border-radius:var(--sheet-radius);
  box-shadow:var(--sheet-shadow);
  color:var(--sheet-ink);
  overflow:hidden;
  /* the ink ramp crosses back to print inside the sheet (the .lit-page boundary) */
  --ink:var(--sheet-ink); --ink-2:var(--sheet-ink-2); --ink-3:var(--sheet-meta);
}
/* F-6 HARVEST TURN — the whole sheet takes a warm-gold cast when the arc is
   finished. Weather + gold carry "finished"; no per-mark labels, no badge. */
.sheet.harvest{
  background-image:
    radial-gradient(120% 70% at 50% 0%, rgba(223,183,89,.22) 0%, rgba(223,183,89,.06) 46%, rgba(223,183,89,0) 72%),
    linear-gradient(180deg,#FEF7E4 0%,#F6E8C8 100%);
}

/* ---- SKY (F-3) — an atmospheric band, not a header. No rule beneath it. ---- */
.sky{
  padding:52px 46px 40px;
  background:linear-gradient(180deg,
    rgba(255,252,244,.95) 0%,
    rgba(253,247,232,.55) 44%,
    rgba(246,239,220,0) 100%);
}
.sky .q{
  font-family:var(--ff-display); font-weight:500;
  font-size:clamp(28px,2.8vw,37px); line-height:1.16; color:var(--sheet-ink);
  margin:0; max-width:34ch; letter-spacing:.002em;
}
/* the answer joins the question in the SAME display voice — one completed
   thought, not a caption under a title (F-3 / law 3) */
.sky .a{
  font-family:var(--ff-display); font-weight:500; font-style:italic;
  font-size:clamp(25px,2.5vw,33px); line-height:1.2; color:#4A4030;
  margin:18px 0 0; max-width:34ch;
}
.sky .invite{
  font-family:var(--ff-display); font-style:italic; font-size:20px;
  color:var(--sheet-meta); margin:0; /* law 4: at most ONE ink-3 line */
}
/* P-3 — value embers RIDE the sky: a small gold mark + fine text. No pill,
   no border, no fill. Sky, not kit chrome. */
.embers{display:flex; gap:22px; flex-wrap:wrap; margin:26px 0 0}
.ember{
  display:inline-flex; align-items:baseline; gap:7px;
  font-family:var(--ff-display); font-style:italic; font-size:15px;
  color:#7A6636;
}
.ember i{
  width:5px; height:5px; border-radius:50%; background:var(--gold-ember);
  box-shadow:0 0 7px 1px rgba(223,183,89,.75); flex:0 0 auto;
  position:relative; top:-3px;
}

/* ---- GATE ROW — every arc control lives here and nowhere else (law 5) ------ */
.gate{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:8px 46px 16px;
}
.gate .nameblock{display:flex; flex-direction:column; gap:3px; margin-right:auto; min-width:0}
.gate .arcname{
  font-family:var(--ff-display); font-size:23px; line-height:1.1; color:var(--sheet-ink-2);
  border:0; border-bottom:1px dashed transparent; background:none; padding:0;
  cursor:text; max-width:46ch;
}
.gate .arcname:hover{border-bottom-color:rgba(38,32,25,.22)}
.gate .arcname:focus{outline:none; border-bottom-color:var(--gold)}
.gate .kicker{
  font-family:var(--ff-mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--sheet-meta);
}
.btn{
  font-family:var(--ff-body); font-size:13.5px; border-radius:999px; cursor:pointer;
  padding:9px 16px; border:1px solid rgba(38,32,25,.2); background:rgba(255,255,255,.5);
  color:var(--sheet-ink); transition:border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
  min-height:36px;
}
.btn:hover{border-color:var(--gold)}
.btn-primary{background:linear-gradient(180deg,#F0D79A,#DFB759); border-color:transparent; color:#3d2807; font-weight:600}
.btn-door{border-color:rgba(143,106,18,.5); color:#6b5a24; font-weight:500}
.btn-door.is-published{background:rgba(143,106,18,.10); cursor:default}
.btn-more{width:36px; padding:0; text-align:center; color:var(--sheet-meta)}

/* ---- THE FIELD — one ground. Nothing floats on it as a panel (law 1) ------- */
.field{position:relative; padding:0 46px 10px; background:transparent}
.field-inner{position:relative}
.threads{position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none}
/* law 10: gold, subtle, CSS-only, still */
.threads path{fill:none; stroke:var(--thread); stroke-width:1.3; opacity:.42}
.mark{
  position:absolute; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:8px;
  cursor:pointer; background:none; border:0; padding:0;
}
.mark svg{display:block; overflow:visible}
/* F-7 QUIET LABELS — resting mark carries its NAME and nothing else. */
.mark .mlabel{
  font-family:var(--ff-body); font-size:12.5px; color:var(--sheet-ink-2);
  max-width:16ch; text-align:center; line-height:1.32;
  transition:color var(--dur-fast) var(--ease);
}
/* the count is a property of the APPROACH, not of resting (F-7) */
.mark .mmeta{
  font-family:var(--ff-mono); font-size:10px; letter-spacing:.06em;
  color:var(--sheet-meta); text-transform:uppercase;
  opacity:0; height:0; overflow:hidden;
  transition:opacity var(--dur-fast) var(--ease);
}
.mark.lit .mmeta{opacity:1; height:auto}
.mark.lit .mlabel{color:var(--sheet-ink)}
.mark.lit .halo{opacity:1}
/* F-4 — the maturity coal. Gold only; steps with the gathered count. */
.halo{transition:opacity var(--dur-gentle) var(--ease)}
.field-empty{height:150px}   /* F-5: generous minimum only. No void. */

/* ---- SOIL ROW (F-7) — shelf-dialect mini covers on a soil-tinted band ------ */
.soil{padding:20px 46px 26px; background:linear-gradient(180deg,rgba(88,68,34,.05),rgba(88,68,34,.10))}
.soil-h{
  font-family:var(--ff-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--sheet-meta); margin:0 0 14px;
}
.soil-row{display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap}
.book{
  width:58px; height:82px; border-radius:2px 3px 3px 2px; position:relative; cursor:pointer;
  background:linear-gradient(150deg,#FBF4E2,#EFE3C7);
  box-shadow:0 1px 2px rgba(38,32,25,.20), 0 4px 10px rgba(38,32,25,.10);
  overflow:hidden;
}
.book:before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:rgba(38,32,25,.16)}
.book i{position:absolute; left:4px; right:0; top:0; height:3px}
.book span{
  position:absolute; left:10px; right:5px; top:10px;
  font-family:var(--ff-display); font-size:9px; line-height:1.2; color:#4A4030;
}
.book em{
  position:absolute; left:10px; right:5px; bottom:7px; font-style:normal;
  font-family:var(--ff-mono); font-size:6.5px; letter-spacing:.04em; color:#8A7F5F;
}

/* ---- MARK COMPOSER — form leads; taken combinations are unavailable (law 6) - */
.scrim{position:fixed; inset:0; background:rgba(10,12,18,.62); z-index:60; display:none;
  align-items:flex-start; justify-content:center; padding:70px 18px 30px; overflow:auto}
.scrim.on{display:flex}
.composer{
  width:100%; max-width:680px;
  background-color:var(--sheet-1); background-image:linear-gradient(180deg,var(--sheet-1),var(--sheet-2));
  border-radius:var(--sheet-radius); box-shadow:var(--sheet-shadow); color:var(--sheet-ink);
  padding:26px 28px 24px;
}
.composer h3{font-family:var(--ff-display); font-weight:500; font-size:24px; margin:0 0 3px}
.composer .sub{font-family:var(--ff-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--sheet-meta); margin:0 0 18px}
.comp-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:9px}
.comp-cell{
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px;
  padding:9px 3px 7px; min-height:74px;
  border:1px solid var(--rule); border-radius:10px; background:rgba(255,255,255,.45); cursor:pointer;
}
.comp-cell:hover{border-color:var(--gold)}
.comp-cell .cname{font-family:var(--ff-mono); font-size:8.5px; letter-spacing:.04em; color:var(--sheet-meta); text-transform:uppercase}
.comp-cell.taken{opacity:.34; cursor:not-allowed; background:repeating-linear-gradient(45deg,rgba(38,32,25,.05) 0 5px,transparent 5px 10px)}
.comp-cell.taken .cname{text-decoration:line-through}
.comp-cell.sel{border-color:var(--gold); box-shadow:inset 0 0 0 1px var(--gold)}
.comp-grid-3{grid-template-columns:repeat(3,1fr)}
.comp-preview{display:flex; align-items:center; justify-content:center; height:104px;
  border:1px solid var(--rule); border-radius:10px; background:rgba(255,255,255,.5)}
.comp-row-h{font-family:var(--ff-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--sheet-meta); margin:18px 0 8px}
.comp-foot{display:flex; align-items:center; gap:12px; margin-top:20px; padding-top:16px; border-top:1px solid var(--rule)}
.comp-foot .law{font-family:var(--ff-body); font-size:12px; color:var(--sheet-ink-2); margin-right:auto}

/* ---- P-1 PROBE (?probe=1) — every silhouette at the SMALLEST maturity size - */
.probe{padding:34px 46px 40px}
.probe h2{font-family:var(--ff-display); font-weight:500; font-size:26px; margin:0 0 4px}
.probe .psub{font-family:var(--ff-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--sheet-meta); margin:0 0 24px}
.probe-row{display:flex; gap:26px; flex-wrap:wrap; margin:0 0 26px}
.probe-cell{display:flex; flex-direction:column; align-items:center; gap:7px; width:74px}
.probe-cell .pn{font-family:var(--ff-mono); font-size:8.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--sheet-meta)}
.probe-h{font-family:var(--ff-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--sheet-ink-2); margin:0 0 14px; padding-top:8px; border-top:1px solid var(--rule)}

/* ---- the ?audit=1 readout — dev chrome, same class as the mk-bar --------- */
.audit{padding:18px 17px 22px; border-top:1px solid var(--rule); background:rgba(38,32,25,.04)}
.audit h3{font-family:var(--ff-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--sheet-meta); margin:0 0 10px; font-weight:500}
.audit table{border-collapse:collapse; width:100%; font-family:var(--ff-mono); font-size:9.5px; line-height:1.5}
.audit td{padding:3px 6px 3px 0; vertical-align:top; border-bottom:1px solid rgba(38,32,25,.07)}
.audit .k{color:var(--sheet-meta); white-space:nowrap}
.audit .v{color:var(--sheet-ink)}
.audit .p{font-weight:500; white-space:nowrap}
.audit .p.ok{color:#3B682B}
.audit .p.no{color:#94371F}
.audit .n{color:var(--sheet-meta)}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
/* ===========================================================================
   STAGE 2 — 390. Same grammar full-width. One field, ONE SCROLL WORLD: no
   inner scroll context anywhere in the vertical axis, no pinch/pan, and no
   horizontal page scroll at any weather (proved, not assumed — see the
   stage-2 report). The only horizontal scroller in the file is the soil row,
   which is the shelf's own dialect for a cover band and is not a second
   scroll WORLD; at this fixture's five books it does not even engage.
   =========================================================================== */
body.w390{overflow-x:hidden}
/* the dev bar wraps to three lines at 390 and, fixed, sits on top of the sky.
   It is chrome, not the design — at this width it stacks above the world
   instead of floating over it. */
body.w390 .mk-bar{position:static}
body.w390 .world{padding:14px 10px 26px}
body.w390 .sheet{max-width:370px}

/* the horizon band goes SLIM — the sky is a strip here, not a room */
body.w390 .sky{padding:24px 17px 18px}
body.w390 .sky .q{font-size:22px; line-height:1.2; max-width:none}
body.w390 .sky .a{font-size:19px; line-height:1.26; margin-top:13px; max-width:none}
body.w390 .sky .invite{font-size:17px}
body.w390 .embers{gap:14px; margin-top:16px}
body.w390 .ember{font-size:13.5px}

/* GATE ROW STACKS: name + kicker own row 1; the acts own row 2 at 44px */
body.w390 .gate{padding:2px 17px 14px; gap:9px}
body.w390 .gate .nameblock{width:100%; margin-right:0; margin-bottom:3px}
body.w390 .gate .arcname{font-size:21px}
body.w390 .btn{min-height:44px; padding:11px 15px}   /* P3 44px targets */
body.w390 .btn-primary{flex:1 1 auto}
body.w390 .btn-door{flex:1 1 auto}
body.w390 .btn-more{width:44px; flex:0 0 44px}

body.w390 .field{padding:0 13px 6px}
/* PROPOSED LAW, NOT RULED (flagged in the Stage 2 report) — at 390 a resting
   label clamps to TWO lines. The vertical stretch above buys room but cannot
   fix a genuine 2D collision: "Pain and Struggle on the Path of Liberation"
   runs to three lines and its box then reaches the mark below it. Clamping
   drops a resting label's footprint from ~48px to ~32px. The full name is
   never lost — it returns whole on approach (the lit state), which is where
   F-7 already says the detail lives. Preston rules whether a mark's name may
   ever be shortened on the field; until then this is visibly on, not silent. */
body.w390 .mark .mlabel{
  max-width:13ch; font-size:12px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
body.w390 .mark.lit .mlabel{-webkit-line-clamp:none; overflow:visible}

/* soil = a horizontal cover band at the field's foot (shelf dialect) */
body.w390 .soil{padding:15px 17px 20px}
body.w390 .soil-h{margin-bottom:11px}
body.w390 .soil-row{flex-wrap:nowrap; overflow-x:auto; gap:10px; padding-bottom:2px; -webkit-overflow-scrolling:touch}
body.w390 .book{width:48px; height:68px; flex:0 0 48px}
body.w390 .book span{left:8px; right:4px; top:8px; font-size:8px}
body.w390 .book em{left:8px; right:4px; bottom:6px; font-size:6px}

body.w390 .comp-grid{grid-template-columns:repeat(3,1fr)}
body.w390 .composer{padding:20px 18px 18px}

<script>
/* ES3-style (var/function, string concat) to match repo convention. */

/* ---- SHAPES-X: NINE silhouettes. Verified distinct at MIN maturity (P-1).
   Built as ten; STONE was CUT by the probe. At 34px a stone reads as a plain
   rounded ovoid — the same silhouette as SEED in solid AND in outline (see
   stage-1r-probe-min-1360-CUT.png, the failing shot, kept as evidence).
   P-1 is explicit: if two forms blur at minimum, one is out. SEED survives
   because it is the arc's own mint word; STONE was a candidate, not canon.
   Nine forms x 3 treatments x 10 pigments = 270 unique identities, far past
   the brief's "well over 16". Angular replacements were considered and
   rejected: an irregular angular boulder collides with BEACON and FACET,
   so the distinct-form budget at 34px is genuinely spent at nine. --------- */
var SILS = ['beacon','facet','seed','frond','gate','spire','well','vessel','bloom'];
var TREATS = ['solid','outline','hatched'];

/* silhouette paths on a 64x62 box */
var PATHS = {
  beacon:  'M32 2 L55 16.5 L55 45.5 L32 60 L9 45.5 L9 16.5 Z',
  facet:   'M32 1 L54 31 L32 61 L10 31 Z',
  seed:    'M32 3 C46 12 52 26 52 37 C52 51 43 59 32 59 C21 59 12 51 12 37 C12 26 18 12 32 3 Z',
  frond:   'M32 1 C49 16 51 41 32 61 C13 41 15 16 32 1 Z',
  gate:    'M32 3 L56 12 V33 C56 48 44 56 32 60 C20 56 8 48 8 33 V12 Z',
  spire:   'M32 3 L59 59 L5 59 Z',
  vessel:  'M7 7 L57 7 L44 59 L20 59 Z',
  bloom:   'M32 2 C41 2 46 10 45 19 C54 18 62 23 62 31 C62 39 54 44 45 43 C46 52 41 60 32 60 C23 60 18 52 19 43 C10 44 2 39 2 31 C2 23 10 18 19 19 C18 10 23 2 32 2 Z'
  /* CUT by P-1 — kept as the record of what was rejected and why:
     stone: 'M10 26 C10 13 20 5 33 7 C48 9 59 18 57 32 C55 48 42 59 28 56 C15 53 10 39 10 26 Z'
     At 34px this is SEED with a lean. Not distinct. Out. */
};
/* well = a ring: two circles, evenodd. Its own renderer branch (below). */
var WELL_OUTER = 'M32 31 m-29 0 a29 29 0 1 0 58 0 a29 29 0 1 0 -58 0';
var WELL_INNER = 'M32 31 m-13 0 a13 13 0 1 0 26 0 a13 13 0 1 0 -26 0';

/* ---- PALETTE-X: 10 pigments, NAMED not numbered (P-4) --------------------- */
/* R-2 (Preston, 2026-07-22): GOLD RETIRES AS A PIGMENT. Semantic gold
   completes — gold is attention / coal / harvest ONLY, never identity. The
   10-pigment floor is held by VERDIGRIS #3C9257 (hue 139), which lands dead
   centre of the widest remaining gap (moss 104 -> teal 174): 35 degrees from
   each neighbour, well past the 25-degree floor, and 3.36:1 on the sheet foot.
   Aged copper — earth/jewel register, no gold in it. Migration: existing
   m1/gold marks re-point to OCHRE, the nearest surviving pigment. */
var HUES = ['madder','terracotta','ochre','olive','moss','verdigris','teal','lapis','iris','plum'];
var HUE_NAMES = {
  'madder':'madder', 'terracotta':'terracotta', 'ochre':'ochre',
  'olive':'olive', 'moss':'moss', 'verdigris':'verdigris', 'teal':'teal',
  'lapis':'lapis', 'iris':'iris', 'plum':'plum'
};

/* ---- F-4 MATURITY: three size steps, driven by the gathered/woven count.
   The coal is GOLD ONLY and steps with the same number — pigment never glows
   (semantic gold law). "Just planted" is the smallest and carries no coal. */
function maturity(count){
  if (count >= 4) { return { d:56, glow:.55, word:'mature' }; }
  if (count >= 3) { return { d:45, glow:.30, word:'growing' }; }
  return { d:34, glow:0, word:'nascent' };
}
var MIN_D = 34;   /* P-1 probes HERE — the smallest size F-4 produces */
/* The arrangement's vertical scale: mark y% is taken off this, in pixels.
   At 390 it STRETCHES. Horizontal room collapses from ~1108px to ~344px, so
   two marks that were separated by their x distance at 1360 are only ~79px
   apart at 390 while their labels are ~90px wide. Giving the field more
   vertical room is the proportional half of the answer — the same class of
   display-time transform as xBand: every mark keeps its relative place, and
   nothing is written back to the user's stored arrangement. */
function baseY(){ return isNarrow() ? 760 : 470; }

/* ---- FIXTURES -----------------------------------------------------------
   growing = REAL, read from js/state.js:3648-3677 (the repo-shipped
   '__praxis_seed__' worked example). Titles, evidence counts, body lengths,
   books and the connection graph are all as they exist in state.

   *** F-1 / P-2 COLLISION — REPORTED, NOT RESOLVED HERE ***
   P-2 says real connection pairs first. The REAL graph is
     S1-S2, S2-S3, S3-S4   (from linkedSubTheories: S1->[S2], S2->[S1,S3],
     S3->[S2,S4], S4->[S3]; views.js:11936-11957 derives arc.edges from these)
   — which is a 4-node CHAIN, and every mark is connected. F-1 asks for a
   graph that is NOT a chain and where not every mark is connected. Both
   cannot hold on real data. Resolution taken, pending Preston's ruling:
   the GROWING weather carries the real graph honestly, and F-1's visual
   requirement is met by ARRANGEMENT (F-2 scatters the path so no left-to-
   right reading survives); the sparse/unconnected demonstration rides the
   FINISHED weather, which is synthetic-shape and labelled as such.        */
var FIXTURES = {
  growing: {
    synthetic:false,
    note:'REAL — __praxis_seed__ "A Pedagogy of Desire": 4 sub-theories · 5 books · 11 evidence · 3 real links · values 0 (real)',
    name:'A Pedagogy of Desire',
    kicker:'GATHERING · nascent',
    question:'What does it cost a reader to be taught that their wanting is the problem rather than the place to begin?',
    answer:null,
    values:[],
    door:'Finish →', doorState:'growing',
    /* label + count + bodyChars are REAL (state.js). x/y are the arrangement —
       the user's hand, and the one thing that is ours to compose (F-2). */
    marks:[
      { sil:'beacon', treat:'solid',   hue:'terracotta', count:4, chars:1658, x:21, y:26, label:'Desire as Political Refusal' },
      { sil:'frond',  treat:'solid',   hue:'moss',       count:3, chars:1455, x:57, y:14, label:'Eros in the Classroom' },
      { sil:'well',   treat:'outline', hue:'lapis',      count:2, chars:3156, x:38, y:63, label:'Pain and Struggle on the Path of Liberation' },
      { sil:'bloom',  treat:'hatched', hue:'plum',       count:2, chars:1568, x:78, y:47, label:'Radical Self-Actualization' }
    ],
    threads:[[0,1],[1,2],[2,3]],   /* REAL — every pair from linkedSubTheories */
    books:[
      { t:'Zombie Politics', a:'Giroux',  k:'#7C8B4F' },
      { t:'Yearning',        a:'hooks',   k:'#B8425A' },
      { t:'Hidden Potential',a:'Grant',   k:'#4A7BB8' },
      { t:'Range',           a:'Epstein', k:'#4A7BB8' },
      { t:'Their Eyes Were Watching God', a:'Hurston', k:'#A85A8E' }
    ]
  },
  ember: {
    synthetic:true,
    note:'SYNTHETIC-SHAPE — extrapolated: no zero-sub-theory arc exists on the account',
    name:'Untitled arc',
    kicker:'EMBER',
    question:null,
    invite:'No question yet — plant something, or name what you are circling.',
    answer:null,
    values:[],
    door:'Finish →', doorState:'growing',
    marks:[], threads:[], books:[]
  },
  finished: {
    synthetic:true,
    note:'SYNTHETIC-SHAPE — no finished arc exists; the 6-mark sparse graph and the 2 value embers are invented (F-1 demonstration)',
    name:'A Pedagogy of Desire',
    kicker:'FINISHED · harvest',
    question:'What does it cost a reader to be taught that their wanting is the problem rather than the place to begin?',
    answer:'It costs them the only engine that was ever theirs.',
    values:[ 'attention as care', 'refusal is literacy' ],
    door:'Publish →', doorState:'finished',
    marks:[
      { sil:'beacon', treat:'solid',   hue:'terracotta', count:6, x:19, y:24, label:'Desire as Political Refusal' },
      { sil:'frond',  treat:'solid',   hue:'moss',       count:4, x:52, y:13, label:'Eros in the Classroom' },
      { sil:'well',   treat:'outline', hue:'lapis',      count:5, x:35, y:56, label:'Pain and Struggle on the Path of Liberation' },
      { sil:'bloom',  treat:'hatched', hue:'plum',       count:3, x:74, y:41, label:'Radical Self-Actualization' },
      { sil:'spire',  treat:'solid',   hue:'ochre',      count:4, x:63, y:70, label:'The disimagination machine' },
      { sil:'facet',  treat:'outline', hue:'iris',       count:2, x:12, y:62, label:'Match quality' }
    ],
    /* sparse + non-sequential: 5 is unconnected; 2 is the hub; no chain. */
    threads:[[0,2],[1,2],[2,4],[3,4]],
    books:[
      { t:'Zombie Politics', a:'Giroux',  k:'#7C8B4F' },
      { t:'Yearning',        a:'hooks',   k:'#B8425A' },
      { t:'Hidden Potential',a:'Grant',   k:'#4A7BB8' },
      { t:'Range',           a:'Epstein', k:'#4A7BB8' },
      { t:'Their Eyes Were Watching God', a:'Hurston', k:'#A85A8E' }
    ]
  }
};

/* compose one mark: silhouette x treatment x pigment. */
function markSVG(m, d){
  var fill = 'var(--' + m.hue + ')', edge = 'var(--' + m.hue + '-edge)';
  var uid = (m.sil + m.treat + m.hue).replace(/-/g,'');
  var mat = maturity(m.count);
  var body = '', p;

  if (m.sil === 'well') {
    /* the ring: outer + inner, evenodd. Treatments read on the annulus. */
    if (m.treat === 'outline') {
      body = '<path d="' + WELL_OUTER + '" fill="none" stroke="' + edge + '" stroke-width="3"/>' +
             '<path d="' + WELL_INNER + '" fill="none" stroke="' + edge + '" stroke-width="3"/>';
    } else if (m.treat === 'hatched') {
      body = '<defs><pattern id="p' + uid + '" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
             '<line x1="0" y1="0" x2="0" y2="6" stroke="' + fill + '" stroke-width="3"/></pattern></defs>' +
             '<path fill-rule="evenodd" d="' + WELL_OUTER + ' ' + WELL_INNER + '" fill="url(#p' + uid + ')" stroke="' + edge + '" stroke-width="2"/>';
    } else {
      body = '<path fill-rule="evenodd" d="' + WELL_OUTER + ' ' + WELL_INNER + '" fill="' + fill + '" stroke="' + edge + '" stroke-width="2"/>';
    }
  } else {
    p = PATHS[m.sil];
    if (m.treat === 'solid') {
      body = '<path d="' + p + '" fill="' + fill + '" stroke="' + edge + '" stroke-width="2"/>';
    } else if (m.treat === 'outline') {
      body = '<path d="' + p + '" fill="none" stroke="' + edge + '" stroke-width="3.2"/>';
    } else {
      body = '<defs><pattern id="p' + uid + '" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
             '<line x1="0" y1="0" x2="0" y2="6" stroke="' + fill + '" stroke-width="3"/></pattern></defs>' +
             '<path d="' + p + '" fill="url(#p' + uid + ')" stroke="' + edge + '" stroke-width="2"/>';
    }
  }
  /* F-4 the coal — GOLD ONLY, stepped by maturity. Pigment never glows.
     A soft radial bloom, NOT a stroked ring: a ring reads as a badge or a
     border around the mark (it did, in the first 1R capture), which is
     chrome. A coal has no edge — it is light the mark is sitting in. */
  var halo = '';
  if (mat.glow > 0) {
    halo = '<defs><radialGradient id="g' + uid + '">' +
             '<stop offset="38%" stop-color="var(--gold-ember)" stop-opacity="' + mat.glow + '"/>' +
             '<stop offset="68%" stop-color="var(--gold-ember)" stop-opacity="' + (mat.glow * 0.34) + '"/>' +
             '<stop offset="100%" stop-color="var(--gold-ember)" stop-opacity="0"/>' +
           '</radialGradient></defs>' +
           '<circle class="halo" cx="32" cy="31" r="52" fill="url(#g' + uid + ')"/>';
  }
  var size = d || mat.d;
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 64 62">' + halo + body + '</svg>';
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var current = 'growing';

/* ---- F-1/F-2: threads are drawn in REAL PIXELS after layout, so a curve is
   an actual arc between two placed marks and never a stretched viewBox
   artifact. Each curve bows perpendicular to its own chord, alternating
   side by index, so no set of curves ever reads as one route. ------------ */
/* ---- STAGE 2: at 390 the arrangement is NORMALISED into a safe band, never
   clipped and never re-authored. The user's relative composition is preserved
   exactly — the extremes map to the band edges and everything between keeps
   its proportional place — because positions are the user's authorship
   (covenant law) and narrowing the viewport must not move a mark relative to
   its neighbours. The band exists because a centred 13ch label hanging off a
   mark at x=78 would otherwise cross the sheet edge, and RD-2 forbids
   horizontal overflow at any width. ---------------------------------------- */
function xBand(marks){
  var mn = 100, mx = 0, k, out = [];
  if (!isNarrow()) {
    for (k = 0; k < marks.length; k++) { out[k] = marks[k].x; }
    return out;
  }
  for (k = 0; k < marks.length; k++) {
    if (marks[k].x < mn) { mn = marks[k].x; }
    if (marks[k].x > mx) { mx = marks[k].x; }
  }
  for (k = 0; k < marks.length; k++) {
    out[k] = (mx - mn < 1) ? 50 : (22 + ((marks[k].x - mn) / (mx - mn)) * 56);
  }
  return out;
}
function isNarrow(){ return document.body.className.indexOf('w390') > -1; }

function drawThreads(f, inner, xs, tops){
  var w = inner.clientWidth, h = inner.clientHeight, i, s = '';
  if (!w || !h) { return; }
  for (i = 0; i < f.threads.length; i++) {
    var ia = f.threads[i][0], ib = f.threads[i][1];
    /* y is PIXELS off BASE_Y — the same math the marks use, so a thread
       always lands on its mark's centre whatever the box height became. */
    var ax = xs[ia] / 100 * w, ay = tops[ia];
    var bx = xs[ib] / 100 * w, by = tops[ib];
    var dx = bx - ax, dy = by - ay;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var bow = (i % 2 === 0) ? 0.11 : -0.11;      /* alternate the bow */
    var cx = (ax + bx) / 2 + (-dy / len) * len * bow;
    var cy = (ay + by) / 2 + ( dx / len) * len * bow;
    s += '<path vector-effect="non-scaling-stroke" d="M ' + ax + ' ' + ay +
         ' Q ' + cx + ' ' + cy + ' ' + bx + ' ' + by + '"/>';
  }
  inner.getElementsByClassName('threads')[0].innerHTML = s;
}

function render(w){
  var f = FIXTURES[w], i;
  current = w;
  document.getElementById('sheet').className = (w === 'finished') ? 'sheet harvest' : 'sheet';

  /* ---- SKY: question alone / question+answer+embers / pre-question ------- */
  var h = '';
  if (f.question) {
    h += '<h1 class="q">' + esc(f.question) + '</h1>';
    if (f.answer) { h += '<p class="a">' + esc(f.answer) + '</p>'; }
  } else {
    h += '<p class="invite">' + esc(f.invite) + '</p>';
  }
  if (f.values && f.values.length) {
    var ev = '<div class="embers">';
    for (i = 0; i < f.values.length; i++) {
      ev += '<span class="ember"><i></i>' + esc(f.values[i]) + '</span>';
    }
    h += ev + '</div>';
  }
  document.getElementById('sky').innerHTML = h;

  /* ---- GATE ROW: name+kicker · one act · one door · overflow -------------- */
  var doorCls = 'btn btn-door' + (f.doorState === 'published' ? ' is-published' : '');
  /* EMBER DOOR = EMPTY — RULED (Preston, 2026-07-22). Law 8: the seat shows
     only takeable acts, and an empty arc cannot be finished. The door appears
     with the FIRST SUB-THEORY, so the gate is the sub-theory count alone. */
  var seatEmpty = (f.marks.length === 0);
  document.getElementById('gate').innerHTML =
    '<span class="nameblock">' +
      '<span class="arcname" contenteditable="true" spellcheck="false">' + esc(f.name) + '</span>' +
      '<span class="kicker">' + esc(f.kicker) + '</span>' +
    '</span>' +
    '<button class="btn btn-primary" type="button" onclick="openComposer()">+ Sub-theory</button>' +
    (seatEmpty ? '' : '<button class="' + doorCls + '" type="button">' + esc(f.door) + '</button>') +
    '<button class="btn btn-more" type="button" title="Delete arc · Return to ember">⋯</button>';

  /* ---- FIELD: marks planted in 2D, gold threads between ------------------ */
  var fieldEl = document.getElementById('field');
  if (!f.marks.length) {
    /* F-5 + law 4: the sky's invitation IS the one --ink-3 line. Open ground
       carries nothing else, and the sheet does not hold a void open. */
    fieldEl.innerHTML = '<div class="field-empty"></div>';
  } else {
    /* RD-2: the sheet grows to the LOWEST mark plus breathing room.
       Vertical positions are PIXELS off a fixed BASE, never percentages of
       the box being computed — a percentage top inside a height derived from
       that same top is circular, and it strands a void under the lowest mark
       (it did, in the first 1R capture: 154px of nothing). */
    var lowestPx = 0, tops = [], xs = xBand(f.marks);
    for (i = 0; i < f.marks.length; i++) {
      tops[i] = Math.round((f.marks[i].y / 100) * baseY());
      if (tops[i] > lowestPx) { lowestPx = tops[i]; }
    }
    var hpx = Math.max(300, lowestPx + 108);
    var mk = '';
    for (i = 0; i < f.marks.length; i++) {
      var m = f.marks[i], mat = maturity(m.count);
      mk += '<button class="mark" type="button" data-i="' + i + '" style="left:' + xs[i] + '%;top:' + tops[i] + 'px">' +
              markSVG(m) +
              '<span class="mlabel">' + esc(m.label) + '</span>' +
              '<span class="mmeta">' + m.count + ' gathered · ' + mat.word + '</span>' +
            '</button>';
    }
    fieldEl.innerHTML = '<div class="field-inner" style="height:' + hpx + 'px">' +
                        '<svg class="threads"></svg>' + mk + '</div>';
    drawThreads(f, fieldEl.getElementsByClassName('field-inner')[0], xs, tops);
  }

  /* ---- SOIL ROW: sparse-honest — no books, no band ----------------------- */
  var soilEl = document.getElementById('soil');
  if (!f.books.length) {
    soilEl.innerHTML = '';
    soilEl.style.display = 'none';
  } else {
    soilEl.style.display = '';
    var sb = '<p class="soil-h">What this field grows from</p><div class="soil-row">';
    for (i = 0; i < f.books.length; i++) {
      sb += '<span class="book" title="' + esc(f.books[i].t) + '">' +
            '<i style="background:' + f.books[i].k + '"></i>' +
            '<span>' + esc(f.books[i].t) + '</span>' +
            '<em>' + esc(f.books[i].a) + '</em></span>';
    }
    soilEl.innerHTML = sb + '</div>';
  }

  /* shape-provenance note in the dev bar */
  var note = document.getElementById('shapeNote');
  note.innerHTML = f.synthetic ? '<span class="synth">' + esc(f.note) + '</span>' : esc(f.note);

  var wb = document.getElementById('segWeather').getElementsByTagName('button');
  for (i = 0; i < wb.length; i++) { wb[i].className = (wb[i].getAttribute('data-w') === w) ? 'on' : ''; }
  wireMarks();
}

/* tap 1 = step closer (staged lighting). Full approach lands at Stage 3. */
function wireMarks(){
  var ms = document.getElementsByClassName('mark'), i;
  for (i = 0; i < ms.length; i++) {
    (function(el){
      el.onclick = function(e){
        e.stopPropagation();
        var lit = el.className.indexOf('lit') > -1;
        var all = document.getElementsByClassName('mark'), j;
        for (j = 0; j < all.length; j++) { all[j].className = 'mark'; }
        if (!lit) { el.className = 'mark lit'; }
      };
    })(ms[i]);
  }
}
document.onclick = function(){
  var all = document.getElementsByClassName('mark'), j;
  for (j = 0; j < all.length; j++) { all[j].className = 'mark'; }
};

/* ---- COMPOSER: form-first grid; combos already in this arc are closed ----- */
/* The mint: form is chosen, then treatment, then pigment. Uniqueness is
   enforced on the FULL triple; Plant is refused while the identity collides.
   Within-arc uniqueness is guaranteed by construction (law 6). */
var compSel = { sil:'beacon', treat:'solid', hue:'terracotta' };

function takenSet(){
  var f = FIXTURES[current], t = {}, i;
  for (i = 0; i < f.marks.length; i++) {
    t[f.marks[i].sil + '|' + f.marks[i].treat + '|' + f.marks[i].hue] = 1;
  }
  return t;
}

function renderComposer(){
  var taken = takenSet(), i, html;
  document.getElementById('compPreview').innerHTML =
    markSVG({ sil:compSel.sil, treat:compSel.treat, hue:compSel.hue, count:0 }, 62);

  html = '';
  for (i = 0; i < SILS.length; i++) {
    html += '<div class="comp-cell' + (SILS[i] === compSel.sil ? ' sel' : '') + '" data-k="sil" data-v="' + SILS[i] + '">' +
            markSVG({ sil:SILS[i], treat:compSel.treat, hue:compSel.hue, count:0 }, 34) +
            '<span class="cname">' + SILS[i] + '</span></div>';
  }
  document.getElementById('rowSil').innerHTML = html;

  html = '';
  for (i = 0; i < TREATS.length; i++) {
    html += '<div class="comp-cell' + (TREATS[i] === compSel.treat ? ' sel' : '') + '" data-k="treat" data-v="' + TREATS[i] + '">' +
            markSVG({ sil:compSel.sil, treat:TREATS[i], hue:compSel.hue, count:0 }, 34) +
            '<span class="cname">' + TREATS[i] + '</span></div>';
  }
  document.getElementById('rowTreat').innerHTML = html;

  html = '';
  for (i = 0; i < HUES.length; i++) {
    var closed = !!taken[compSel.sil + '|' + compSel.treat + '|' + HUES[i]];
    html += '<div class="comp-cell' + (HUES[i] === compSel.hue ? ' sel' : '') + (closed ? ' taken' : '') + '" data-k="hue" data-v="' + HUES[i] + '">' +
            markSVG({ sil:compSel.sil, treat:compSel.treat, hue:HUES[i], count:0 }, 34) +
            '<span class="cname">' + HUE_NAMES[HUES[i]] + (closed ? ' · taken' : '') + '</span></div>';
  }
  document.getElementById('rowHue').innerHTML = html;

  var collide = !!taken[compSel.sil + '|' + compSel.treat + '|' + compSel.hue];
  document.getElementById('compLaw').innerHTML = collide
    ? 'That identity already stands in this arc — choose another form or pigment.'
    : 'No two marks share a full identity. ' + FIXTURES[current].marks.length + ' standing; this one is free.';
  var pb = document.getElementById('plantBtn');
  pb.disabled = collide;
  pb.style.opacity = collide ? '.42' : '1';
  pb.style.cursor = collide ? 'not-allowed' : 'pointer';

  var cells = document.getElementsByClassName('comp-cell');
  for (i = 0; i < cells.length; i++) {
    (function(el){
      el.onclick = function(){
        if (el.className.indexOf('taken') > -1) { return; }   /* closed = unpickable */
        compSel[el.getAttribute('data-k')] = el.getAttribute('data-v');
        renderComposer();
      };
    })(cells[i]);
  }
}

function openComposer(){
  /* opens on a deliberately COLLIDING identity when the arc already holds one,
     so the uniqueness law is visible the moment the mint opens */
  compSel = { sil:'beacon', treat:'solid', hue:'terracotta' };
  renderComposer();
  document.getElementById('scrim').className = 'scrim on';
}
function closeComposer(){ document.getElementById('scrim').className = 'scrim'; }

/* ---- P-1 PROBE: every silhouette at the SMALLEST size F-4 produces -------- */
function renderProbe(){
  var i, t, html = '<div class="probe"><h2>Silhouette probe — distinctness at minimum</h2>' +
    '<p class="psub">every form at ' + MIN_D + 'px = the smallest maturity step (P-1) · pigment held constant so FORM is the only variable</p>';
  for (t = 0; t < TREATS.length; t++) {
    html += '<p class="probe-h">' + TREATS[t] + '</p><div class="probe-row">';
    for (i = 0; i < SILS.length; i++) {
      html += '<span class="probe-cell">' +
              markSVG({ sil:SILS[i], treat:TREATS[t], hue:'ochre', count:0 }, MIN_D) +
              '<span class="pn">' + SILS[i] + '</span></span>';
    }
    html += '</div>';
  }
  html += '<p class="probe-h">the ten pigments — one form, resting size</p><div class="probe-row">';
  for (i = 0; i < HUES.length; i++) {
    html += '<span class="probe-cell">' +
            markSVG({ sil:'seed', treat:'solid', hue:HUES[i], count:0 }, 45) +
            '<span class="pn">' + HUE_NAMES[HUES[i]] + '</span></span>';
  }
  html += '</div></div>';
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('shapeNote').innerHTML = 'P-1 PROBE — silhouettes at ' + MIN_D + 'px (minimum maturity size)';
}

/* ---- STAGE 2 AUDIT (?audit=1) — the 390 laws MEASURED, not asserted.
   Renders its own readout into the page so the proof is a dated capture at
   the real viewport rather than a claim in a report. --------------------- */
function runAudit(){
  var vw = window.innerWidth, out = [], i, el, r;
  var docW = document.documentElement.scrollWidth;
  out.push(['viewport width', vw + 'px', true]);
  out.push(['document scrollWidth', docW + 'px',
            docW <= vw, 'RD-2: no horizontal overflow at any width']);

  /* who, if anyone, crosses the right edge */
  var all = document.getElementsByTagName('*'), worst = 0, worstSel = 'none';
  for (i = 0; i < all.length; i++) {
    el = all[i];
    if (el.className && String(el.className).indexOf('mk-') === 0) { continue; }
    r = el.getBoundingClientRect();
    if (r.width && r.right > worst) { worst = r.right; worstSel = el.className || el.tagName; }
  }
  out.push(['furthest right edge', Math.round(worst) + 'px (' + worstSel + ')',
            worst <= vw + 0.5, 'nothing crosses the viewport']);

  /* P3: every interactive target at 44px. Scoped to the GATE ROW — a global
     .btn sweep also picks up the composer's buttons, which sit inside a
     display:none scrim and measure 0, manufacturing a phantom FAIL. */
  var btns = document.getElementById('gate').getElementsByClassName('btn'), minH = 999, names = [];
  for (i = 0; i < btns.length; i++) {
    r = btns[i].getBoundingClientRect();
    if (r.height < minH) { minH = r.height; }
    names.push(Math.round(r.height));
  }
  out.push(['gate targets (px)', names.join(' · '), minH >= 44, 'P3: 44px minimum']);

  /* one scroll world: no vertical inner scroller anywhere */
  var inner = [];
  for (i = 0; i < all.length; i++) {
    el = all[i];
    if (el === document.body || el === document.documentElement) { continue; }
    var ov = window.getComputedStyle(el).overflowY;
    if ((ov === 'auto' || ov === 'scroll') && el.scrollHeight > el.clientHeight + 1) {
      inner.push(el.className || el.tagName);
    }
  }
  out.push(['vertical inner scrollers', inner.length ? inner.join(', ') : 'none',
            inner.length === 0, 'one scroll world']);

  /* the sky, slim */
  var sky = document.getElementById('sky'), q = sky.getElementsByClassName('q')[0];
  out.push(['sky band height', Math.round(sky.getBoundingClientRect().height) + 'px', true, 'slim horizon']);
  if (q) {
    var qs = window.getComputedStyle(q), lh = parseFloat(qs.lineHeight);
    var qh = q.getBoundingClientRect().height, lines = Math.round(qh / lh);
    out.push(['question', q.textContent.length + ' chars · ' + lines + ' lines · ' +
              Math.round(qh) + 'px', q.scrollWidth <= q.clientWidth + 1,
              'horizon fit: no truncation, no overflow']);
  }

  /* soil: a cover band, and whether it actually engages its scroller */
  var sr = document.getElementsByClassName('soil-row')[0];
  if (sr) {
    out.push(['soil row', Math.round(sr.clientWidth) + 'px box · ' +
              Math.round(sr.scrollWidth) + 'px content',
              true, sr.scrollWidth > sr.clientWidth + 1
                ? 'band scrolls (shelf dialect)' : 'band fits — scroller idle']);
  }

  var html = '<div class="audit"><h3>Stage 2 · 390 audit</h3><table>';
  for (i = 0; i < out.length; i++) {
    var row = out[i];
    html += '<tr><td class="k">' + row[0] + '</td><td class="v">' + row[1] + '</td>' +
            '<td class="p ' + (row[2] ? 'ok' : 'no') + '">' + (row[2] ? 'PASS' : 'FAIL') + '</td>' +
            '<td class="n">' + (row[3] || '') + '</td></tr>';
  }
  html += '</table></div>';
  var d = document.createElement('div');
  d.innerHTML = html;
  document.getElementById('sheet').appendChild(d.firstChild);
}

/* ---- width toggle + URL params (headless capture drives these) ------------ */
function setWidth(x){
  document.body.className = (x === '390') ? 'w390' : '';
  var xb = document.getElementById('segWidth').getElementsByTagName('button'), k;
  for (k = 0; k < xb.length; k++) { xb[k].className = (xb[k].getAttribute('data-x') === x) ? 'on' : ''; }
  /* the safe band is resolved AT RENDER, so a width flip must re-render.
     Guarded so init's setWidth-before-render stays a no-op. */
  var fi = document.getElementById('field');
  if (fi && fi.innerHTML) { render(current); }
}
(function init(){
  var q = location.search, w = 'growing', x = '1360', i;
  var mw = q.match(/weather=([a-z]+)/); if (mw && FIXTURES[mw[1]]) { w = mw[1]; }
  var mx = q.match(/w=(390|1360)/);     if (mx) { x = mx[1]; }
  /* STAGE 2 horizon-fit case (?q=long). The REAL seed question is already
     105 chars — inside the 100-120 band the fit check names — so the honest
     stress case is a SYNTHETIC question at the band's top: 114 chars. If the
     sky holds this at 390 with no truncation and no overflow, no truncation
     law is needed. Recorded rather than assumed. */
  if (q.indexOf('q=long') > -1) {
    FIXTURES.growing.question =
      'What is a reader actually consenting to when they accept that their own hunger is the thing standing in their way?';
    FIXTURES.growing.note = FIXTURES.growing.note + ' · HORIZON-FIT CASE: synthetic 114-char question';
  }
  var seg = document.getElementById('segWeather').getElementsByTagName('button');
  for (i = 0; i < seg.length; i++) {
    (function(b){ b.onclick = function(){ render(b.getAttribute('data-w')); }; })(seg[i]);
  }
  var segx = document.getElementById('segWidth').getElementsByTagName('button');
  for (i = 0; i < segx.length; i++) {
    (function(b){ b.onclick = function(){ setWidth(b.getAttribute('data-x')); }; })(segx[i]);
  }
  setWidth(x);
  if (q.indexOf('probe=1') > -1) { renderProbe(); return; }
  render(w);
  /* headless-capture hook: ?composer=1 opens the mark composer for a shot */
  if (q.indexOf('composer=1') > -1) { openComposer(); }
  if (q.indexOf('audit=1') > -1) { runAudit(); }
  /* threads are px-measured and the band is width-dependent, so a box change
     is a full re-render, not just a re-stroke */
  window.onresize = function(){ render(current); };
})();
</script>
